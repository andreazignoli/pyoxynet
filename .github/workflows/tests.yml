name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # LiteRT ships wheels for Linux, Windows and macOS on Apple silicon (macos-latest)
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "./pyoxynet[test]"
      - run: python -m pytest -q
        working-directory: pyoxynet/tests

  package:
    name: Wheel and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build pyoxynet --outdir dist
      - run: python .github/check_dist.py dist/*.whl
      - run: python -m pip install -r docs/requirements.txt dist/*.whl
      - run: python -m sphinx -W --keep-going -b html docs docs/_build/html
